apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-engine
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: remediation-engine-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: remediation-engine-binding
subjects:
  - kind: ServiceAccount
    name: remediation-engine
    namespace: default
roleRef:
  kind: ClusterRole
  name: remediation-engine-role
  apiGroup: rbac.authorization.k8s.io
